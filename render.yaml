envVarGroups:
  # One shared value prevents the web service and cron worker from drifting
  # to different secrets. Render generates the value once for the group.
  - name: dashboard-cron-auth
    envVars:
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: admind-agentic-dashboard
    runtime: node
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    # Call /api/warmup after every deploy so the in-memory + file cache is
    # pre-populated before the first real user request.
    healthCheckPath: /api/warmup

    envVars:
      # ── Scoro ─────────────────────────────────────────────────────────────
      - key: COMPANY_BASE_URL
        value: https://admindagency.scoro.com/api/v2
      - key: SCORO_API_KEY
        sync: false          # set manually in Render dashboard
      - key: SCORO_COMPANY_ACCOUNT_ID
        value: admindagency
      - key: KPI_YEAR
        value: "2026"
      - key: SYNC_INTERVAL_DAYS
        value: "3"

      # ── Scoro user credentials (needed for bookmarks/offer-prep lookup) ──
      - key: SCORO_USER_USERNAME
        sync: false          # set manually in Render dashboard
      - key: SCORO_USER_PASSWORD
        sync: false          # set manually in Render dashboard
      - key: SCORO_OFFER_PREP_BOOKMARK_ID
        sync: false          # set manually in Render dashboard

      # ── OpenAI ────────────────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false          # set manually in Render dashboard

      # ── Neon Postgres (primary persistent snapshot store) ───────────────
      - key: DATABASE_URL
        sync: false

      # ── Upstash Redis (optional legacy fallback if DATABASE_URL unset) ──
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false

      # ── Cron auth (recommended) ───────────────────────────────────────────
      - fromGroup: dashboard-cron-auth

      # ── Next.js ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

  # Check daily and refresh only snapshots that are at least 3 days old.
  # Daily checks self-heal after a missed/failed run.
  - type: cron
    name: sync-all-directors
    schedule: "0 5 * * *"
    runtime: node
    buildCommand: pnpm install
    startCommand: node scripts/cron-sync-all.mjs
    envVars:
      - key: APP_BASE_URL
        fromService:
          type: web
          name: admind-agentic-dashboard
          property: host
      - fromGroup: dashboard-cron-auth
